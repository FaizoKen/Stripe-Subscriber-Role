<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stripe Subscriber Role — My status</title>
<link rel="icon" href="{{BASE_URL}}/favicon.ico">
<style>
  :root { color-scheme: dark; --brand:#635bff; --ok:#3ecf8e; }
  * { box-sizing:border-box; }
  body { margin:0; background:#0f1115; color:#e8eaed; line-height:1.55;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:15px; padding:40px 20px; }
  .wrap { max-width:560px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 6px; }
  .sub { color:#8a93a4; margin:0 0 24px; font-size:14px; }
  .card { background:#14171f; border:1px solid #262b36; border-radius:12px; padding:18px 20px; margin:14px 0; }
  .btn { display:inline-block; background:var(--brand); color:#fff; border:0; border-radius:9px;
    padding:12px 22px; font-size:15px; font-weight:600; cursor:pointer; text-decoration:none; font-family:inherit; }
  .btn:hover { background:#544cff; }
  .btn.sec { background:#262b36; }
  .btn.sec:hover { background:#313845; }
  .btn:disabled { opacity:.6; cursor:default; }
  .sub-item { display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:10px 0; border-bottom:1px solid #20242e; }
  .sub-item:last-child { border-bottom:0; }
  .badge { font-size:11px; font-weight:700; padding:2px 8px; border-radius:10px; white-space:nowrap; }
  .badge.active { background:#10331f; color:var(--ok); }
  .badge.trial { background:#3a2c10; color:#fbbf24; }
  .badge.due { background:#3a2c10; color:#fbbf24; }
  .badge.off { background:#2a1518; color:#f6b8c0; }
  .muted { color:#8a93a4; font-size:13px; }
  .note { color:#fbbf24; font-size:13px; margin-top:2px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  code { background:#0b0d12; padding:1px 5px; border-radius:4px; font-size:12.5px; }
  .toast { padding:10px 12px; border-radius:8px; font-size:14px; margin-top:12px; }
  .toast.ok { background:#10331f; border:1px solid #1f5c3a; color:#bff3d8; }
  .toast.e { background:#2a1518; border:1px solid #5c2630; color:#f6b8c0; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="sub">Loading…</p></div>
<script>
const BASE_URL="{{BASE_URL}}";
// Opened from a server's link (?guild=…): show that server's subscriptions,
// and come back to it after signing in.
const GUILD=(new URLSearchParams(location.search).get('guild')||'').replace(/\D/g,'');
const QS=GUILD?`?guild=${GUILD}`:'';
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// An amount in the currency's smallest unit, in that currency ($5.00, ¥500).
function money(c,cur){ if(c==null) return ''; const code=(cur||'usd').toUpperCase();
  try{ const f=new Intl.NumberFormat(undefined,{style:'currency',currency:code});
    return f.format(Number(c)/Math.pow(10,f.resolvedOptions().maximumFractionDigits)); }
  catch(_){ return code+' '+(Number(c)/100).toFixed(2); } }
function day(iso){ if(!iso) return ''; try{ return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }catch(_){ return ''; } }
const PER={day:'day',week:'week',month:'month',year:'year'};
const STATUS={canceled:'Canceled',unpaid:'Unpaid',paused:'Paused',incomplete:'Waiting for the first payment',
  incomplete_expired:'Checkout not completed',past_due:'Past due'};

async function load(){
  let d;
  try{ const r=await fetch(`${BASE_URL}/verify/status${QS}`,{credentials:'include',cache:'no-store'});
    d=await r.json(); }catch(e){ app().innerHTML=`<div class="toast e">Network error.</div>`; return; }
  render(d);
}
function app(){ return document.getElementById('app'); }

/* One subscription line: what it is, and what happens next. */
function item(m){
  const plan=m.plan_amount_cents?`${money(m.plan_amount_cents,m.currency)}${m.billing_interval&&PER[m.billing_interval]?' / '+PER[m.billing_interval]:''}`:'';
  let badge, label, note='';
  if(m.has_active_subscription&&m.is_trialing){
    badge=['trial','TRIAL']; label=['Free trial',m.trial_end?`ends ${day(m.trial_end)}`:'',plan].filter(Boolean).join(' · ');
  } else if(m.has_active_subscription){
    badge=['active','ACTIVE'];
    const next=m.cancels_at_period_end?(m.current_period_end?`ends ${day(m.current_period_end)}`:'ends at period end')
      :(m.current_period_end?`renews ${day(m.current_period_end)}`:'');
    label=['Active',plan,next].filter(Boolean).join(' · ');
    if(m.cancels_at_period_end) note='Set to cancel — your role stays until then.';
  } else if(m.is_past_due||m.status==='past_due'){
    badge=['due','PAST DUE']; label=['Past due',plan].filter(Boolean).join(' · ');
    note='A payment failed. Update your card with the seller to keep your subscriber role.';
  } else {
    badge=['off','INACTIVE']; label=m.status?(STATUS[m.status]||m.status):'Customer, no subscription';
  }
  return `<div class="sub-item">
    <div><div><b>${esc(m.account)}</b> ${m.livemode?'':'<span class="muted">(test)</span>'}</div>
      <div class="muted">${esc(label)}</div>${note?`<div class="note">${esc(note)}</div>`:''}</div>
    <span class="badge ${badge[0]}">${badge[1]}</span></div>`;
}

function render(d){
  if(!d.signed_in_discord){
    app().innerHTML=`<h1>Your subscription status</h1>
      <p class="sub">Sign in with Discord to see which subscriber roles you qualify for.</p>
      <form method="POST" action="${BASE_URL}/verify/login${QS}"><button class="btn" type="submit">Sign in with Discord</button></form>`;
    return;
  }
  const ms=d.memberships||[];
  let body;
  if(ms.length===0){
    body=`<div class="card"><b>No Stripe subscription is linked to your Discord account yet.</b>
      <p class="muted" style="margin:8px 0 0">Linking is automatic: when you subscribe through the server's checkout,
      your Discord ID is saved with your payment, and your role arrives within a minute. Just subscribed? Give it a
      moment, then press “Re-check now”. Paid another way, or while signed in to a different Discord account?
      Ask the server's admins.</p></div>`;
  } else {
    body=`<div class="card">${ms.map(item).join('')}</div>`;
  }
  app().innerHTML=`<h1>Hi ${esc(d.discord_username||'there')} 👋</h1>
    <p class="sub">Your Stripe subscriber roles are granted automatically based on the status below.</p>
    ${body}
    <div class="row">
      <button class="btn sec" id="recheck">Re-check now</button>
    </div>
    <div id="msg"></div>`;
  document.getElementById('recheck').addEventListener('click',recheck);
}

async function recheck(){
  const b=document.getElementById('recheck'); b.disabled=true; b.textContent='Re-checking…';
  try{ const r=await fetch(`${BASE_URL}/verify/refresh`,{method:'POST',credentials:'include',
      headers:{'Content-Type':'application/json'}});
    if(r.ok) document.getElementById('msg').innerHTML=`<div class="toast ok">Re-checking your roles — they'll update within a minute.</div>`;
    else document.getElementById('msg').innerHTML=`<div class="toast e">Could not refresh. Try again shortly.</div>`;
  }catch(e){ document.getElementById('msg').innerHTML=`<div class="toast e">Network error.</div>`; }
  finally{ b.disabled=false; b.textContent='Re-check now'; }
}
load();
</script>
</body>
</html>
